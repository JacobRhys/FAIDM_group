{% extends 'base.html' %}

{% block content %}
<div class="relative overflow-hidden hero-bg">
    <!-- Background Effects -->
    <div
        class="absolute top-0 left-1/2 -translate-x-1/2 w-[1000px] h-[500px] bg-brand-500/20 rounded-full blur-[120px] -z-10 opacity-50 animate-pulse">
    </div>
    <div class="absolute bottom-0 right-1/4 w-[800px] h-[400px] bg-purple-500/10 rounded-full blur-[100px] -z-10 opacity-30 animate-float"
        style="animation-delay: 2s"></div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-20 pb-16 text-center lg:pt-32">
        <h1
            class="mx-auto max-w-4xl font-display text-5xl font-bold tracking-tight text-white sm:text-7xl animate-on-scroll">
            Predict Student Success <br>
            <span class="text-gradient">Before It's Too Late</span>
        </h1>
        <p class="mx-auto mt-6 max-w-2xl text-lg tracking-tight text-slate-300 animate-on-scroll delay-100">
            Harnessing the power of XGBoost to identify at-risk students.
            Proactive intervention starts here.
        </p>
        <div class="mt-10 flex justify-center gap-x-6 animate-on-scroll delay-200">
            <a href="{% url 'dashboard' %}"
                class="group rounded-full bg-white px-8 py-3.5 text-sm font-semibold text-slate-900 shadow-sm hover:bg-slate-100 transition-all duration-300 transform hover:scale-105 btn-cinematic">
                View Dashboard
            </a>
        </div>
    </div>
</div>

{% endblock %}
